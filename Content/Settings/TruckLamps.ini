; The fire trucks' lamps: change a number, save, restart the game.
; (If this file or a line is missing, the game uses the values shown here.)
;   Glow       how bright the lamp's own lens shines (the lens only; it lights nothing round it)
;   GlowSize   how big that shine looks, cm
;   Brightness light thrown onto the world, lumens (headlamp beams, the blue lights' wash, the reversing lamps' ground)
;   Reach      how far that light goes, metres
;   BeamWidth  the beam's full width, degrees (Core: its bright middle)
;   Aim        how far down the beam points, degrees
;   Color      red, green, blue, 0 to 255

[LowBeam]
Glow=40
GlowSize=30
Brightness=3200
Reach=55
BeamWidth=36
Core=20
Aim=6
Color=255,245,230

[HighBeam]
Glow=60
GlowSize=30
Brightness=9000
Reach=160
BeamWidth=15
Core=6
Aim=1.5
Color=255,245,230

[TailLight]
Glow=12
GlowSize=24
Color=255,8,4

[BrakeLight]
Glow=70
GlowSize=34
Color=255,8,4

[Reverse]
Glow=30
GlowSize=26
Brightness=140
Reach=5
Color=255,247,235

[Indicator]
Glow=55
GlowSize=26
Color=255,107,5
; flashes a minute, and how much of each flash the lamp is lit (0 to 1)
FlashesPerMinute=90
OnPart=0.55

[SideMarker]
Glow=10
GlowSize=12
Color=255,107,5

[BlueLights]
Glow=120
GlowSize=46
SideGlowSize=30
; the blue thrown round about: from the roof bar to each side, and ahead / behind from the front and rear lamps
Brightness=9000
Reach=26
FrontRearBrightness=3000
FrontRearReach=12
Color=5,31,255
; one full round (both sides' double flashes), seconds
Round=0.75
