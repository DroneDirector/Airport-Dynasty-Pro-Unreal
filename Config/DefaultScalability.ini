; Lumen's reflections on glass (front-layer translucency) from High quality up (the engine has them only at Epic);
; Low and Medium keep the cheaper screen-space reflections on glass.
[ReflectionQuality@2]
r.Lumen.TranslucencyReflections.FrontLayer.Allow=1
r.Lumen.TranslucencyReflections.FrontLayer.Enable=1

; Cinematic's Lumen indirect light, made for real-time play (2026-11-17, owner: more fps, never visibly worse): the
; engine's Cinematic traces 4x the probes of Epic (DownsampleFactor 8) with a 350 budget - 40 ms of a 45 ms frame at
; 3840x1080 on an RTX 3070 Ti (18 fps). Kept: Cinematic's finer rays (TracingOctahedronResolution 16, Epic has 8); the
; probe spacing and budget from Epic's side. 18 -> 31 fps; side-by-side pictures day and night: no visible loss (the
; night ones calmer - docs/Pictures/Quality).
[GlobalIlluminationQuality@Cine]
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.RadianceCache.NumProbesToTraceBudget=200
r.Lumen.ScreenProbeGather.NumAdaptiveProbes=8
r.Lumen.ScreenProbeGather.FullResolutionJitterWidth=1
