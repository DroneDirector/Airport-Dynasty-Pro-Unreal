name: Airport Dynasty Pro – build

on:
  push:
    branches: [main]
    paths:
      - 'Airline-Manager-Pro-Babylon/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amp-babylon-build
  cancel-in-progress: true

jobs:
  pc:
    name: PC app (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Airline-Manager-Pro-Babylon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: The KTX2 texture decoder (Babylon.js, Apache 2.0; Basis Universal transcoders, Apache 2.0; Zstandard, BSD), shipped with the app
        shell: bash
        run: |
          mkdir -p www/ktx2
          curl -fsSL "https://cdn.babylonjs.com/babylon.ktx2Decoder.js" -o www/ktx2/babylon.ktx2Decoder.js
          curl -fsSL "https://cdn.babylonjs.com/zstddec.wasm" -o www/ktx2/zstddec.wasm
          for f in uastc_astc.wasm uastc_bc7.wasm uastc_rgba8_unorm_v2.wasm uastc_rgba8_srgb_v2.wasm uastc_r8_unorm.wasm uastc_rg8_unorm.wasm msc_basis_transcoder.js msc_basis_transcoder.wasm; do curl -fsSL "https://cdn.babylonjs.com/ktx2Transcoders/1/$f" -o "www/ktx2/$f"; done
          ls -la www/ktx2
      - name: The WebGPU shader translators (glslang, BSD/Apache; Tint as twgsl, Apache 2.0), shipped with the PC app
        shell: bash
        run: |
          mkdir -p www/webgpu
          for f in glslang/glslang.js glslang/glslang.wasm twgsl/twgsl.js twgsl/twgsl.wasm; do curl -fsSL "https://cdn.babylonjs.com/$f" -o "www/webgpu/$(basename $f)"; done
          ls -la www/webgpu
      - name: Package for Windows
        working-directory: Airline-Manager-Pro-Babylon/pc
        run: |
          npm install --no-audit --no-fund
          node package.mjs
      - name: Zip and the installer
        id: zip
        shell: pwsh
        working-directory: Airline-Manager-Pro-Babylon/pc
        run: |
          $v = (Get-Content ../app.config.json | ConvertFrom-Json).version
          $f = "AirportDynastyPro-PC-$v.zip"
          Compress-Archive -Path "build/Airport Dynasty Pro PC" -DestinationPath $f
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $env:AMPB_VERSION = $v
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "build/AirportDynastyPro-PC-Setup-$v.exe" .
          "file=$f" >> $env:GITHUB_OUTPUT
          "setup=AirportDynastyPro-PC-Setup-$v.exe" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: amp-babylon-pc
          path: |
            Airline-Manager-Pro-Babylon/pc/${{ steps.zip.outputs.file }}
            Airline-Manager-Pro-Babylon/pc/${{ steps.zip.outputs.setup }}

  apk:
    name: Android app
    needs: pc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Airline-Manager-Pro-Babylon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the app
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: The KTX2 texture decoder (Babylon.js, Apache 2.0; Basis Universal transcoders, Apache 2.0; Zstandard, BSD), shipped with the app
        shell: bash
        run: |
          mkdir -p www/ktx2
          curl -fsSL "https://cdn.babylonjs.com/babylon.ktx2Decoder.js" -o www/ktx2/babylon.ktx2Decoder.js
          curl -fsSL "https://cdn.babylonjs.com/zstddec.wasm" -o www/ktx2/zstddec.wasm
          for f in uastc_astc.wasm uastc_bc7.wasm uastc_rgba8_unorm_v2.wasm uastc_rgba8_srgb_v2.wasm uastc_r8_unorm.wasm uastc_rg8_unorm.wasm msc_basis_transcoder.js msc_basis_transcoder.wasm; do curl -fsSL "https://cdn.babylonjs.com/ktx2Transcoders/1/$f" -o "www/ktx2/$f"; done
          ls -la www/ktx2
      - name: Prepare the Android project
        run: bash scripts/android-setup.sh
      - name: Build the APK
        working-directory: Airline-Manager-Pro-Babylon/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        id: apk
        run: |
          V=$(node -p "require('./app.config.json').version")
          F="AirportDynastyPro-Android-${V}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$F"
          echo "file=Airline-Manager-Pro-Babylon/$F" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: amp-babylon-pc
          path: pc
      - name: Publish pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: airline-manager-pro-babylon-v${{ steps.apk.outputs.version }}
          name: Airport Dynasty Pro ${{ steps.apk.outputs.version }}
          prerelease: true
          body_path: Airline-Manager-Pro-Babylon/release-notes/${{ steps.apk.outputs.version }}.md
          files: |
            ${{ steps.apk.outputs.file }}
            pc/*.zip
            pc/*.exe
